name: CI

# Validates every push and pull request, and publishes only if those checks pass.
#
# The deploy lives in this workflow behind `needs:` rather than in a separate one on the
# same trigger. Two workflows on `push: main` run concurrently and the shorter usually
# wins, so a commit with failing tests ships to production and the checks only tell you
# afterwards. Keeping it here makes the ordering structural rather than a policy.
on:
  push:
    branches: ['main']
  pull_request:
  # Manual rebuild — the quickest way to push an admin-portal edit out to crawlers.
  workflow_dispatch:
  # Prerendered HTML is a snapshot of the API taken at build time, so content edited in
  # the portal is live for visitors immediately but invisible to crawlers until the next
  # build. A weekly rebuild bounds that gap without putting a repo-write token in the app.
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ---------------------------------------------------------------------------
  # Set these two for your repo. BASE_PATH is '/<repo-name>/' for a GitHub Pages
  # project site; use '/' for a user/organisation site or a custom domain.
  # ---------------------------------------------------------------------------
  BASE_PATH: /turbohamstarter/
  SITE_URL: https://artoriun.github.io

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          # v5 added automatic caching keyed on package.json's packageManager field, which
          # this repo sets — opted out so the only cache behavior is the explicit one above,
          # unchanged from v4. Same reasoning on every setup-node step in this file.
          package-manager-cache: false

      - run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: API tests
        run: npm run test:api

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Needs the build above: checks gzipped bundle sizes, and that no image URL skips
      # optimizeUrl().
      - name: Budgets
        run: npm run check:budgets

  e2e:
    name: Layout tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          package-manager-cache: false

      - run: npm ci

      # Only Chromium: these are layout assertions against one engine, not a
      # cross-browser matrix.
      #
      # Cached on the resolved version rather than reinstalled every run: the browser
      # binaries alone are ~300MB, downloaded from Playwright's own CDN and normally fast,
      # but a cache hit skips that entirely. The OS-level libraries `--with-deps` also
      # installs live outside this cache path (they're apt packages, not files under
      # ~/.cache/ms-playwright) and so still run on every job regardless of cache-hit — on a
      # cache hit `install-deps` covers just those, without re-fetching the browser itself.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run layout tests
        run: npm run test:e2e

      # Accessibility, SEO and best-practices against the built, prerendered output.
      - name: Build and prerender for audit
        run: npm run build && npm run prerender

      - name: Lighthouse
        run: npm run check:lighthouse

      # Surfaced on the run page so a failure can be read without digging into the log.
      - name: Summarise failures
        if: failure()
        run: |
          {
            echo '### Layout test failures'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' test-results/*/error-context.md 2>/dev/null | head -80 \
              || echo 'no error context captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [verify, e2e]
    # Never from a pull request — a PR build must not publish to production. `schedule`
    # belongs here: without it the weekly run would build and test but skip the deploy, so
    # the cron would silently do nothing for the one reason it exists.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          package-manager-cache: false

      - run: npm ci

      # Builds again rather than reusing the verify job's output on purpose: this one needs
      # VITE_API_URL baked in, and verify builds without secrets. Reusing that artifact
      # would publish a bundle pointing at an empty API URL.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_DEFAULT_LANG: ${{ vars.VITE_DEFAULT_LANG }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}

      # Needs a browser: the prerenderer boots the built app and writes each route's DOM to
      # its own index.html, so Pages serves real HTML at a 200 instead of falling back to
      # 404.html. Also emits sitemap.xml and robots.txt.
      #
      # Cached the same way as the e2e job's install — see the comment there. This job runs
      # on its own separate runner, so it cannot reuse that job's cache entry directly, but
      # it writes to and reads from the same keyed cache across runs.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Prerender routes, sitemap and robots
        run: npm run prerender
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'packages/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
